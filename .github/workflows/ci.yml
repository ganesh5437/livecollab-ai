name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Dummy values so the app's config loads in CI (no real secrets needed for tests).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  client:
    name: Client — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
